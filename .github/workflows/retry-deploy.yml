name: Retry Deploy to GitHub Pages

# Deploy to GitHub Pages can fail before any of its own steps even run —
# e.g. GitHub couldn't provision a hosted runner for it ("job was not
# acquired by Runner... even after multiple attempts"), same as Daily
# Backup can. This watches for that workflow finishing with a failure and
# re-runs it — GitHub tracks each re-run as a new "attempt" on the same
# run, so run_attempt caps how many times this will retry before giving up.
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  actions: write

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Wait before retrying
        run: sleep 60

      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
