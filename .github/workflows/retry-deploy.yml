name: Retry Deploy to GitHub Pages

# Deploy to GitHub Pages can fail before any of its own steps even run —
# e.g. GitHub couldn't provision a hosted runner for it ("job was not
# acquired by Runner... even after multiple attempts"), same as Daily
# Backup can. This watches for that workflow finishing with a failure and
# re-runs it — GitHub tracks each re-run as a new "attempt" on the same
# run, so run_attempt caps how many times this will retry before giving up.
on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

jobs:
  retry:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Wait before retrying
        run: sleep 60

      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X POST \
            "repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"

  # Retries are exhausted and it's still failing — this is the one case
  # worth actually interrupting someone for, so open an issue (which emails
  # the repo owner same as a failed-run notification would) instead of
  # relying on GitHub's own per-attempt Actions emails, which fire on every
  # transient attempt above even when the retry job then fixes it quietly.
  alert:
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt >= 3
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open an issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Deploy to GitHub Pages failed ${{ github.event.workflow_run.run_attempt }} times in a row" \
            --label "ci-failure" \
            --body "Deploy to GitHub Pages kept failing after automatic retries — the live site may be out of date. Run: ${{ github.event.workflow_run.html_url }}"
